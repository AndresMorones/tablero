<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Bitácora</title>
<style>
  html, body { margin: 0; background: #0d1117; color: #c9d1d9; }
  body { font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 26rem; margin: 30vh auto 0; padding: 0 16px; text-align: center; }
  button { margin-top: 12px; padding: 8px 18px; font: inherit; color: inherit; background: #21262d;
           border: 1px solid #30363d; border-radius: 6px; }
</style>
</head>
<body>
<main><p id="msg">Abriendo el tablero…</p></main>
<script>
// Fetches the sealed dashboard, opens it with the key from the link's #fragment (or the one this
// device kept from an earlier visit) and replaces this page with it. Nothing readable is served.
(function () {
  'use strict';
  var STORE = 'bitacora.pageKey';
  var PAYLOAD = 'dashboard.bin?v=535411afdc22afdd';
  var IV_BYTES = 12;

  function show(text, retry) {
    var main = document.querySelector('main');
    main.innerHTML = '';
    var p = document.createElement('p');
    p.textContent = text;
    main.appendChild(p);
    if (retry) {
      var b = document.createElement('button');
      b.textContent = 'Reintentar';
      b.onclick = function () { location.reload(); };
      main.appendChild(b);
    }
  }

  function readStored() {
    try { return localStorage.getItem(STORE); } catch (e) { return null; }
  }
  function store(value) {
    try { value ? localStorage.setItem(STORE, value) : localStorage.removeItem(STORE); } catch (e) { /* private mode */ }
  }

  function keyFromLink() {
    var m = /(?:^#|&)k=([A-Za-z0-9_-]{43})(?:&|$)/.exec(location.hash);
    if (!m) return null;
    store(m[1]);
    // Keep the key out of the address bar, history and screenshots from here on.
    history.replaceState(null, '', location.pathname + location.search);
    return m[1];
  }

  function decodeKey(b64url) {
    var b64 = b64url.replace(/-/g, '+').replace(/_/g, '/') + '=';
    var raw = atob(b64), out = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }

  if (!window.crypto || !crypto.subtle || typeof DecompressionStream === 'undefined') {
    show('Este navegador es demasiado viejo para abrir el tablero. Actualízalo e inténtalo de nuevo.');
    return;
  }
  var encoded = keyFromLink() || readStored();
  if (!encoded) {
    show('Este tablero es privado. Ábrelo desde tu enlace personal (el que trae la llave).');
    return;
  }

  var keyPromise = crypto.subtle.importKey('raw', decodeKey(encoded), { name: 'AES-GCM' }, false, ['decrypt']);
  fetch(PAYLOAD)
    .then(function (r) {
      if (!r.ok) throw new Error('http ' + r.status);
      return r.arrayBuffer();
    })
    .catch(function () { throw { kind: 'network' }; })
    .then(function (sealed) {
      return keyPromise.then(function (key) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: sealed.slice(0, IV_BYTES) }, key, sealed.slice(IV_BYTES));
      }).catch(function () { throw { kind: 'key' }; });
    })
    .then(function (gz) {
      var stream = new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));
      return new Response(stream).text();
    })
    .then(function (html) {
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function (err) {
      if (err && err.kind === 'key') {
        store(null);
        show('La llave guardada no abre esta versión del tablero. Abre de nuevo tu enlace personal.');
      } else if (err && err.kind === 'network') {
        show('No se pudo descargar el tablero. Revisa tu conexión.', true);
      } else {
        show('No se pudo abrir el tablero.', true);
      }
    });
})();
</script>
</body>
</html>
